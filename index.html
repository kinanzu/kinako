<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <div id="top">
        <h1>わたしの飼っている猫</h1>
    </div>

    <div class="main-layout">

            <img src="imageフォルダ/kinako.png">
            <ul>
                <li>名前 きなこ</li>
                <li>年齢 六歳</li>
            </ul>
        </div>
        
        <div id="favorite">
            <div class="container">

                    <img src="imageフォルダ/kari.png">
                </div>
            </div>

        <div id="photo-desc">
            <p>デカい</p>
        </div>

        <div id="history">
            <h2>家にきた経緯</h2>
            <p>友達の母親の友達がブリーダーだった
                <br>家に来た時は声がデカすぎてびびった
            </p>
        </div>

        <div id="kitten">
            <h2>特徴</h2>
            <p>とんでもなくビビり
                <br>家に家族以外の誰かが来ると隅っこから出てこない
            </p>
        </div>
    </div>

</html>
